<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品上傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --mat: #24584A;
    --mat-line: rgba(255, 255, 255, .08);
    --tape: #F3C63F;
    --tape-ink: #3A2E05;
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1C2421;
    --muted: #5E6B66;
    --line: #D5DDD9;
    --field: #FBFCFB;
    --danger: #B93A27;
    --danger-bg: #FBEAE6;
    --focus: #2B7A65;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --mat: #1C4639;
      --mat-line: rgba(255, 255, 255, .06);
      --bg: #101614;
      --surface: #18201D;
      --ink: #E4EBE7;
      --muted: #9AA9A2;
      --line: #2E3A35;
      --field: #131A17;
      --danger: #F08A76;
      --danger-bg: #3A1F1A;
      --focus: #6FC7A6;
      color-scheme: dark;
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.65;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 切割墊頁首 */
  .mat {
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--mat-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: #F4F7F5;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 64px;
  }
  .mat-inner { max-width: 560px; margin: 0 auto; }
  .mat h1 { margin: 0; font-size: 1.6rem; line-height: 1.3; font-weight: 700; letter-spacing: .02em; }
  .mat p { margin: 8px 0 0; color: rgba(244, 247, 245, .82); font-size: .95rem; white-space: pre-line; }

  main { max-width: 560px; margin: -40px auto 0; padding: 0 16px 40px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 20px;
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .panel > p { margin: 0 0 16px; color: var(--muted); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: 6px; }
  .field .opt { color: var(--muted); font-weight: 400; }
  .field input[type=text], .field input[type=email] {
    width: 100%;
    padding: 11px 13px;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1.5px solid var(--line);
    border-radius: 8px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  input:focus-visible, button:focus-visible, .drop:focus-visible {
    outline: 2.5px solid var(--focus);
    outline-offset: 2px;
  }

  .drop {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 26px 16px;
    text-align: center;
    cursor: pointer;
    background: var(--field);
  }
  .drop.over { border-color: var(--focus); }
  .drop b { display: block; font-size: 1rem; }
  .drop span { color: var(--muted); font-size: .85rem; }

  .preview {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--field);
  }
  .preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
  .preview .pdf-icon {
    width: 64px; height: 64px; border-radius: 6px; display: grid; place-items: center;
    background: var(--danger-bg); color: var(--danger); font-weight: 700;
  }
  .preview .info { flex: 1; min-width: 0; }
  .preview .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview .size { color: var(--muted); font-size: .85rem; }

  .check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; color: var(--muted); margin: 4px 0 18px; }
  .check input { margin-top: 5px; }

  .btn {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; padding: 13px 18px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink);
  }
  .btn.primary { width: 100%; background: var(--tape); border-color: var(--tape); color: var(--tape-ink); font-size: 1.05rem; }
  .btn.primary:disabled { opacity: .55; cursor: wait; }
  .btn.small { padding: 6px 12px; font-size: .88rem; font-weight: 500; }
  .link-btn { background: none; border: none; color: var(--danger); font: inherit; cursor: pointer; padding: 6px; }

  .err {
    background: var(--danger-bg); color: var(--danger);
    border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; font-size: .92rem;
  }

  /* 捲尺進度條 */
  .tape {
    position: relative; height: 46px; border-radius: 6px; overflow: hidden;
    background: var(--field); border: 1px solid var(--line); margin: 22px 0 10px;
  }
  .tape-fill {
    position: absolute; inset: 0 auto 0 0; width: 0;
    background-color: var(--tape);
    background-image:
      repeating-linear-gradient(90deg, var(--tape-ink) 0 1.5px, transparent 1.5px 50px),
      repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 10px);
    background-size: 100% 58%, 100% 30%;
    background-repeat: repeat-x;
    background-position: 0 0, 0 0;
    transition: width .7s ease;
  }
  .stages { display: grid; grid-template-columns: repeat(4, 1fr); font-size: .82rem; color: var(--muted); }
  .stages span:last-child { text-align: right; }
  .stages span:nth-child(2), .stages span:nth-child(3) { text-align: center; }
  .stages .on { color: var(--ink); font-weight: 700; }
  .stage-msg { margin: 18px 0 0; font-size: 1rem; }
  @media (prefers-reduced-motion: reduce) { .tape-fill { transition: none; } }

  /* 結果 */
  .res-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .badge {
    display: inline-block; background: var(--tape); color: var(--tape-ink);
    font-weight: 700; font-size: .85rem; padding: 3px 10px; border-radius: 999px;
  }
  .grade { text-align: right; }
  .grade b { display: block; font-size: 2.6rem; line-height: 1; }
  .grade small { color: var(--muted); font-size: .8rem; }
  .summary { margin: 0 0 18px; }
  .dim { border-left: 4px solid var(--tape); padding: 2px 0 2px 14px; margin: 0 0 16px; }
  .dim h3 { margin: 0 0 4px; font-size: 1rem; }
  .dim p { margin: 0; }
  .dim p + p { margin-top: 4px; }
  .dim .k { color: var(--muted); font-size: .85rem; margin-right: 4px; }
  .note { color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); padding-top: 14px; margin: 20px 0 16px; }
  .center { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>
<header class="mat">
  <div class="mat-inner">
    <h1 id="actName">作品上傳</h1>
    <p id="actDesc" hidden></p>
  </div>
</header>

<main>
  <section id="viewLoading" class="panel"><p class="center">載入中…</p></section>

  <section id="viewCode" class="panel" hidden>
    <h2>輸入活動代碼</h2>
    <p>老師會在投影片或黑板上公布 6 碼代碼，掃 QR code 進來的話不用輸入。</p>
    <form id="codeForm">
      <p id="codeErr" class="err" hidden></p>
      <div class="field">
        <label for="codeInput">活動代碼</label>
        <input type="text" id="codeInput" autocomplete="off" autocapitalize="characters" maxlength="10" required>
      </div>
      <button class="btn primary" type="submit">進入活動</button>
    </form>
  </section>

  <section id="viewClosed" class="panel" hidden>
    <h2>這個活動已經關閉</h2>
    <p>目前無法上傳作品。如果你還需要繳交，請直接告訴老師。</p>
  </section>

  <section id="viewForm" class="panel" hidden>
    <form id="uploadForm" novalidate>
      <p id="formErr" class="err" hidden></p>
      <div class="field">
        <label for="fTitle">作品名稱</label>
        <input type="text" id="fTitle" maxlength="60" placeholder="例如：液壓仿生手臂" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="fStudentId">學號</label>
          <input type="text" id="fStudentId" maxlength="30" autocomplete="off" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="fName">姓名</label>
          <input type="text" id="fName" maxlength="30" autocomplete="name" required>
        </div>
      </div>
      <div class="field">
        <label for="fNick">暱稱 <span class="opt">（選填，老師在課堂上展示作品時會用暱稱）</span></label>
        <input type="text" id="fNick" maxlength="30">
      </div>
      <div class="field">
        <label for="fEmail">Email <span class="opt">（老師確認後會把正式評量寄到這裡）</span></label>
        <input type="email" id="fEmail" maxlength="100" autocomplete="email" inputmode="email" required>
      </div>

      <div class="field">
        <label>作品照片或 PDF</label>
        <input type="file" id="fileInput" accept="image/*,application/pdf" hidden>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="選擇作品檔案">
          <b id="dropText">拍照、從相簿選取，或把檔案拖到這裡</b>
          <span>照片會自動壓縮；PDF 上限 10MB</span>
        </div>
        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="作品預覽" hidden>
          <div class="pdf-icon" id="previewPdf" hidden>PDF</div>
          <div class="info">
            <div class="name" id="previewName"></div>
            <div class="size" id="previewSize"></div>
          </div>
          <button type="button" class="link-btn" id="removeFile">換一個</button>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="fRemember">
        <span>在這台裝置記住我的學號、姓名與 Email（共用電腦請不要勾選）</span>
      </label>
      <button class="btn primary" type="submit" id="submitBtn">送出作品</button>
    </form>
  </section>

  <section id="viewProgress" class="panel" hidden aria-live="polite">
    <h2>作品處理中</h2>
    <p>請不要關閉這個頁面，完成後會直接顯示 AI 初評。</p>
    <div class="tape" aria-hidden="true"><div class="tape-fill" id="tapeFill"></div></div>
    <div class="stages" id="stages">
      <span>上傳檔案</span><span>排隊中</span><span>AI 分析</span><span>完成</span>
    </div>
    <p class="stage-msg" id="stageMsg"></p>
  </section>

  <section id="viewResult" class="panel" hidden>
    <div id="resBody"></div>
    <p class="note" id="resNote"></p>
    <p id="remainText" class="center" hidden></p>
    <button class="btn primary" id="againBtn" type="button">再上傳一份作品</button>
  </section>
</main>

<script>
(function () {
  const API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
  const MAX_MB = 10;
  const VIEWS = ['viewLoading', 'viewCode', 'viewClosed', 'viewForm', 'viewProgress', 'viewResult'];
  const $ = id => document.getElementById(id);

  let activity = null;
  let picked = null;        // { blob, mimeType, name }
  let previewUrl = null;
  let remaining = null;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  async function api(action, data) {
    if (!API_URL || API_URL.indexOf('你的部署ID') >= 0) throw new Error('尚未設定後端網址（config.js）');
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, data || {}))
    });
    if (!res.ok) throw new Error('連線失敗（' + res.status + '）');
    return res.json();
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function show(view) { VIEWS.forEach(v => { $(v).hidden = v !== view; }); window.scrollTo(0, 0); }
  function setMsg(id, text) { $(id).textContent = text || ''; $(id).hidden = !text; }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- 活動 ---------- */
  async function openActivity(code) {
    show('viewLoading');
    setMsg('codeErr', '');
    try {
      const r = await api('getActivity', { code });
      if (!r.ok) {
        show('viewCode');
        $('codeInput').value = code;
        setMsg('codeErr', r.msg);
        return;
      }
      activity = r.activity;
      $('actName').textContent = activity.name;
      $('actDesc').textContent = activity.description || '';
      $('actDesc').hidden = !activity.description;
      document.title = activity.name + '｜作品上傳';
      const url = new URL(location.href);
      url.searchParams.set('a', activity.id);
      history.replaceState(null, '', url);
      if (!activity.open) { show('viewClosed'); return; }
      fillRemembered();
      show('viewForm');
    } catch (err) {
      show('viewCode');
      setMsg('codeErr', err.message);
    }
  }

  $('codeForm').addEventListener('submit', e => {
    e.preventDefault();
    const c = $('codeInput').value.trim();
    if (c) openActivity(c);
  });

  function fillRemembered() {
    let p = null;
    try { p = JSON.parse(store.get('student_profile') || 'null'); } catch (e) {}
    if (!p) return;
    $('fStudentId').value = p.studentId || '';
    $('fName').value = p.studentName || '';
    $('fNick').value = p.nickname || '';
    $('fEmail').value = p.email || '';
    $('fRemember').checked = true;
  }

  function rememberProfile(d) {
    if ($('fRemember').checked) {
      store.set('student_profile', JSON.stringify({
        studentId: d.studentId, studentName: d.studentName, nickname: d.nickname, email: d.email
      }));
    } else {
      store.del('student_profile');
    }
  }

  /* ---------- 選檔與壓縮 ---------- */
  $('drop').addEventListener('click', () => $('fileInput').click());
  $('drop').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); }
  });
  $('fileInput').addEventListener('change', e => pickFile(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(n => $('drop').addEventListener(n, e => { e.preventDefault(); $('drop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => $('drop').addEventListener(n, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
  $('drop').addEventListener('drop', e => pickFile(e.dataTransfer.files[0]));
  $('removeFile').addEventListener('click', clearFile);

  async function pickFile(file) {
    if (!file) return;
    setMsg('formErr', '');
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const isImg = file.type.indexOf('image/') === 0 || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name);
    try {
      if (isPdf) {
        if (file.size > MAX_MB * 1024 * 1024) throw new Error('PDF 超過 ' + MAX_MB + 'MB，請壓縮後再上傳');
        picked = { blob: file, mimeType: 'application/pdf', name: file.name };
      } else if (isImg) {
        $('dropText').textContent = '正在壓縮照片…';
        const blob = await compressImage(file);
        if (blob.size > MAX_MB * 1024 * 1024) throw new Error('照片太大，請換一張');
        picked = { blob, mimeType: 'image/jpeg', name: file.name };
      } else {
        throw new Error('只能上傳照片（JPG、PNG）或 PDF');
      }
      renderPreview();
    } catch (err) {
      clearFile();
      setMsg('formErr', err.message);
    } finally {
      $('dropText').textContent = '拍照、從相簿選取，或把檔案拖到這裡';
    }
  }

  async function compressImage(file, maxSide = 1600, quality = 0.85) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = () => reject(new Error('這個瀏覽器無法讀取這種照片格式，請改用 JPG 或 PNG'));
        i.src = url;
      });
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
      if (!blob) throw new Error('照片壓縮失敗，請換一張');
      return blob;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function renderPreview() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    const isPdf = picked.mimeType === 'application/pdf';
    if (!isPdf) {
      previewUrl = URL.createObjectURL(picked.blob);
      $('previewImg').src = previewUrl;
    }
    $('previewImg').hidden = isPdf;
    $('previewPdf').hidden = !isPdf;
    $('previewName').textContent = picked.name;
    $('previewSize').textContent = (picked.blob.size / 1024 / 1024).toFixed(2) + ' MB' + (isPdf ? '' : '（已壓縮）');
    $('drop').hidden = true;
    $('preview').hidden = false;
  }

  function clearFile() {
    picked = null;
    $('fileInput').value = '';
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    $('preview').hidden = true;
    $('drop').hidden = false;
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.onerror = () => reject(new Error('讀取檔案失敗'));
      r.readAsDataURL(blob);
    });
  }

  /* ---------- 送出與等待 ---------- */
  $('uploadForm').addEventListener('submit', async e => {
    e.preventDefault();
    setMsg('formErr', '');
    const d = {
      code: activity.id,
      title: $('fTitle').value.trim(),
      studentId: $('fStudentId').value.trim(),
      studentName: $('fName').value.trim(),
      nickname: $('fNick').value.trim(),
      email: $('fEmail').value.trim()
    };
    if (!d.title || !d.studentId || !d.studentName || !d.email) return setMsg('formErr', '請填寫作品名稱、學號、姓名與 Email');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return setMsg('formErr', 'Email 格式不正確');
    if (!picked) return setMsg('formErr', '請選擇作品照片或 PDF');

    rememberProfile(d);
    $('submitBtn').disabled = true;
    show('viewProgress');
    setStage(0, '正在上傳檔案…');

    let r;
    try {
      const base64 = await blobToBase64(picked.blob);
      r = await api('submit', Object.assign(d, { mimeType: picked.mimeType, base64 }));
    } catch (err) {
      show('viewForm');
      setMsg('formErr', '送出失敗：' + err.message + '。請檢查網路後再按一次送出。');
      $('submitBtn').disabled = false;
      return;
    }
    $('submitBtn').disabled = false;
    if (!r.ok) { show('viewForm'); setMsg('formErr', r.msg); return; }

    remaining = r.remaining;
    const final = await waitForResult(r.id);
    renderResult(final);
  });

  const ANALYZING = 'AI 正在看你的作品，通常需要 10 到 30 秒';

  async function waitForResult(id) {
    const start = Date.now();
    let pos = null;
    while (Date.now() - start < 6 * 60 * 1000) {
      if (pos === null || pos <= 1) setStage(2, ANALYZING);
      let r;
      try {
        r = await api('check', { id });
      } catch (err) {
        await sleep(5000);
        continue;
      }
      if (!r.ok) return { status: 'error', msg: r.msg };
      if (r.status === 'queued') {
        pos = r.position || null;
        setStage(1, pos ? '前面還有 ' + pos + ' 件作品，輪到你時會自動開始分析' : '排隊中，請稍候…');
        await sleep(4000);
        continue;
      }
      if (r.status === 'processing') {
        setStage(2, ANALYZING);
        await sleep(4000);
        continue;
      }
      setStage(3, '完成');
      return r;
    }
    return { status: 'timeout' };
  }

  function setStage(i, msg) {
    $('tapeFill').style.width = [18, 45, 75, 100][i] + '%';
    Array.prototype.forEach.call($('stages').children, (s, j) => s.classList.toggle('on', j === i));
    $('stageMsg').textContent = msg;
  }

  /* ---------- 結果 ---------- */
  function renderResult(r) {
    const body = $('resBody');
    body.innerHTML = '';
    const res = r.result || {};

    if (r.status === 'done') {
      const head = el('div', 'res-head');
      const left = el('div');
      left.append(el('span', 'badge', 'AI 初評'));
      left.append(el('h2', null, $('fTitle').value.trim() || '你的作品'));
      head.append(left);
      if (res.grade) {
        const g = el('div', 'grade');
        g.append(el('b', null, res.grade));
        g.append(el('small', null, '初評等第'));
        head.append(g);
      }
      body.append(head);
      if (res.summary) body.append(el('p', 'summary', res.summary));
      (res.dimensions || []).forEach(d => {
        const box = el('div', 'dim');
        box.append(el('h3', null, d.name));
        const p1 = el('p'); p1.append(el('span', 'k', '做得好'), document.createTextNode(d.strength));
        const p2 = el('p'); p2.append(el('span', 'k', '可以加強'), document.createTextNode(d.suggestion));
        box.append(p1, p2);
        body.append(box);
      });
      $('resNote').textContent = '這是 AI 的初步評量，正式結果以老師確認後寄到你 Email 的版本為準。';
    } else if (r.status === 'invalid') {
      body.append(el('span', 'badge', 'AI 初評'));
      body.append(el('h2', null, '這份檔案沒有通過作品審核'));
      body.append(el('p', 'summary', res.reason || '請確認上傳的是你的作品照片或 PDF。'));
      $('resNote').textContent = 'AI 的判斷也可能出錯，如果你確定上傳的是作品，老師會在後台再次確認。';
    } else {
      body.append(el('h2', null, '作品已收到'));
      body.append(el('p', 'summary', r.msg || 'AI 分析暫時沒有完成，系統會在背景繼續處理，老師確認後會把結果寄到你的 Email。你不需要重新上傳。'));
      $('resNote').textContent = '';
    }

    const noMore = remaining === 0;
    $('againBtn').hidden = noMore;
    $('remainText').hidden = !(noMore || remaining > 0);
    $('remainText').textContent = noMore ? '你在這個活動的上傳次數已經用完。' : '這個活動你還可以上傳 ' + remaining + ' 次。';
    show('viewResult');
  }

  $('againBtn').addEventListener('click', () => {
    clearFile();
    $('fTitle').value = '';
    setMsg('formErr', '');
    show('viewForm');
  });

  /* ---------- 啟動 ---------- */
  const code = new URLSearchParams(location.search).get('a');
  if (code) openActivity(code); else show('viewCode');
})();
</script>
</body>
</html>
